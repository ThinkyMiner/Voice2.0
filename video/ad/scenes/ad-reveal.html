<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vani Lab · ad · reveal</title>
<link rel="stylesheet" href="ad.css">
<style>
  #lock { left: 0; right: 0; top: 0; height: 1080px; transform-origin: 960px 540px; }
  .mark { position: absolute; left: 0; right: 0; top: 352px; text-align: center; font-size: 212px; line-height: 1; letter-spacing: -.03em; }
  .mark em { font-style: italic; }
  #sheen { color: #FFFFFF; -webkit-mask-image: linear-gradient(100deg, transparent 42%, #000 50%, transparent 58%);
    -webkit-mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; opacity: 0; }
  #tag { position: absolute; left: 0; right: 0; top: 628px; text-align: center; font: 300 35px/1.2 var(--f-ui); letter-spacing: -.01em; color: var(--ink-2); }
  #by { position: absolute; left: 0; right: 0; top: 712px; text-align: center; font: 400 17px var(--f-mono); letter-spacing: .34em; color: var(--teal); }
  #sweep { left: -900px; top: -400px; width: 700px; height: 1900px; transform-origin: 50% 50%; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(90deg, rgba(255, 236, 210, 0), rgba(255, 236, 210, .075) 50%, rgba(255, 236, 210, 0)); }
</style>
</head>
<body>
<div id="world">
  <div id="lock">
    <h1 class="mark serif" id="mark">Vani <em>Lab</em></h1>
    <h1 class="mark serif" id="sheen" aria-hidden="true">Vani <em>Lab</em></h1>
    <p id="tag">Every prompt change, proven before it ships.</p>
    <p id="by">BY HARE &amp; TORTOISE</p>
  </div>
  <div id="sweep"></div>
</div>
<script src="../runtime.js"></script>
<script src="ad-kit.js"></script>
<script>
// Black and silence on "Until now." (a single warm point waits at the top of the ring). On "This is Vani Lab" a
// soft light sweeps the frame and the platform's loop ring draws itself in one stroke behind a warm comet head,
// its wave travelling with the head; "Vani Lab" resolves from blur letter by letter, a sheen crosses it, then the
// tagline and "by Hare & Tortoise".
const CX = 960, CY = 540, R = 430, STEPS = 720;
let ctx, chars, lock, sheen, tag, by, sweep, tu, tt, tv, dur;

function init(AD) {
  dur = AD.dur; tu = cue("Until now"); tt = cue("This is Vani Lab"); tv = cue("Vani Lab");
  const world = K.stage();
  ctx = K.canvas(world); world.prepend(ctx.canvas);
  chars = K.chars(document.getElementById("mark"));
  lock = document.getElementById("lock"); sheen = document.getElementById("sheen");
  tag = document.getElementById("tag"); by = document.getElementById("by"); sweep = document.getElementById("sweep");
}

// where the head is (0..1 of the turn, from the top, clockwise): one eased stroke, then a slow drift onward
const headAt = (t) => prog(t, tt - 0.05, 1.35, E.inOutCubic) + 0.07 * Math.max(0, t - (tt + 1.3));

function render(t) {
  K.frame(t, dur);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, K.W, K.H);
  const push = 1 + 0.035 * E.inOutCubic(clamp((t - tt) / (dur - tt)));
  ctx.setTransform(push, 0, 0, push, CX * (1 - push), CY * (1 - push));
  lock.style.transform = `scale(${push.toFixed(5)})`;

  // the waiting point
  const wait = prog(t, tu + 0.25, 0.5) * (1 - prog(t, tt - 0.05, 0.25));
  const hp = headAt(t);
  const ha = -Math.PI / 2 + hp * K.TAU;
  if (wait > 0) glowDot(CX, CY - R, 0.55 * wait * (0.85 + 0.15 * Math.sin(t * 7)), 1);

  // the ring, drawn up to the head; its wave follows the head
  if (t > tt - 0.05) {
    const amp = 2.0 * (1 - 0.35 * prog(t, tt + 1.4, 1.5));
    const pts = K.ringPts(CX, CY, R, 0.8 + t * 1.1, ha, amp, STEPS);
    const echo = K.ringPts(CX, CY, R - 24, 2 - t * 0.9, ha, 1.0, STEPS);
    const all = hp >= 1, n = Math.max(2, Math.round(Math.min(1, hp) * STEPS) + 1);
    const line = (P, from, to, style, w, a) => {
      ctx.beginPath(); ctx.moveTo(P[from][0], P[from][1]);
      for (let i = from + 1; i < to; i++) ctx.lineTo(P[i][0], P[i][1]);
      ctx.strokeStyle = style; ctx.lineWidth = w; ctx.globalAlpha = a; ctx.stroke();
    };
    ctx.lineJoin = ctx.lineCap = "round";
    line(echo, 0, all ? STEPS + 1 : n, K.C.teal, 1.3, 0.32);
    line(pts, 0, all ? STEPS + 1 : n, K.C.teal, 2.2, 0.95);
    // the comet: a warm tail behind the head, fading to teal
    const hi = all ? Math.round((hp % 1) * STEPS) : n - 1, TAIL = 90;
    for (let j = 0; j < TAIL; j++) {
      let e = hi - j;
      if (e <= 0) { if (!all) break; e += STEPS; }
      const k = j / TAIL;
      line(pts, e - 1, e + 1, K.mix(K.C.amberHi, K.C.teal, k ** 0.7), 2.6 - k, (1 - k) ** 1.6);
    }
    ctx.globalAlpha = 1;
    const [hx, hy] = pts[hi];
    glowDot(hx, hy, 1, 1 + 0.6 * (1 - prog(t, tt + 1.2, 0.8)));
  }

  // the light sweep
  const sw = prog(t, tt - 0.1, 1.5, E.inOutCubic);
  sweep.style.transform = `translateX(${(sw * 3600).toFixed(1)}px) rotate(18deg)`;
  sweep.style.opacity = sw > 0 && sw < 1 ? 1 : 0;

  // the lockup
  chars.forEach((c, j) => K.rise(c, E.outCubic(clamp((t - (tv - 0.2) - 0.045 * j) / 0.85)), { y: 34, blur: 18 }));
  const sh = prog(t, tv + 0.85, 1.1, E.inOutCubic);
  sheen.style.opacity = sh > 0 && sh < 1 ? 0.85 : 0;
  sheen.style.webkitMaskPosition = `${(100 - sh * 100).toFixed(2)}% 0`;
  K.rise(tag, prog(t, tv + 0.45, 0.9), { y: 16, blur: 8 });
  K.rise(by, prog(t, tv + 0.7, 0.9), { y: 12, blur: 6 });
  K.bloom(ctx, 0.7, 0.7);
}

function glowDot(x, y, a, s = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, 34 * s);
  g.addColorStop(0, `rgba(255,226,170,${0.9 * a})`); g.addColorStop(0.25, `rgba(240,180,85,${0.35 * a})`); g.addColorStop(1, "rgba(240,180,85,0)");
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 34 * s, 0, K.TAU); ctx.fill();
  ctx.fillStyle = `rgba(255,248,235,${a})`; ctx.beginPath(); ctx.arc(x, y, 4.2 * s, 0, K.TAU); ctx.fill();
}

scene({
  init, render,
  sfx: () => [[cue("Until now"), "riser", 0.8], [cue("This is Vani Lab", -0.02), "boom", 1.0], [cue("This is Vani Lab"), "swell", 1.0],
    [cue("Vani Lab", 1.0), "shimmer", 0.7]],
});
</script>
</body>
</html>
